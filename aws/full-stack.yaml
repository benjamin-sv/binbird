AWSTemplateFormatVersion: "2010-09-09"
Description: Prediction Review static site, Lambda API, and shared progress store.

Parameters:
  SiteBucketName:
    Type: String
    Description: Globally unique S3 bucket name for static site assets.
  CodeS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment zip.
  CodeS3Key:
    Type: String
    Description: S3 key for the Lambda deployment zip.
  DataBucket:
    Type: String
    Default: bird-detection-data
    Description: S3 bucket containing detections and source images.
  DetectionsPrefix:
    Type: String
    Default: detections/
    Description: Prefix containing detection job folders.
  AccessKey:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Shared key required by the browser when calling the review API.
  ImageUrlSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Secret used by Lambda to sign short-lived image URLs.
  SharpLayerArn:
    Type: String
    Default: arn:aws:lambda:ap-southeast-2:031496224070:layer:sharp:1
    Description: Lambda layer ARN that provides sharp for crop generation.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
  CorsOrigin:
    Type: String
    Default: "*"
    Description: Browser origin allowed to call the Lambda API.
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain name for the static site.
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate ARN in us-east-1 for the custom domain.

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled

  CloudFrontOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: website-bucket
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOac
        DefaultCacheBehavior:
          TargetOriginId: website-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}"

  ProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  CropQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 960
      MessageRetentionPeriod: 86400

  ReviewFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: review-api-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${DataBucket}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${DataBucket}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${DataBucket}/${DetectionsPrefix}*"
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt ProgressTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:SendMessageBatch
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt CropQueue.Arn

  ReviewFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ReviewFunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Architectures:
        - x86_64
      MemorySize: 4096
      Timeout: 900
      Layers:
        - !Ref SharpLayerArn
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          DETECTIONS_PREFIX: !Ref DetectionsPrefix
          PROGRESS_TABLE: !Ref ProgressTable
          ACCESS_KEY: !Ref AccessKey
          IMAGE_URL_SECRET: !Ref ImageUrlSecret
          CORS_ORIGIN: !Ref CorsOrigin
          IMAGE_URL_SECONDS: "3600"
          S3_IMAGE_URL_SECONDS: "3600"
          CROP_WORKER_MAX_GROUPS: "40"
          CROP_WORKER_MAX_DETECTIONS: "8000"
          CROP_WORKER_MAX_MILLIS: "720000"
          CROP_UPLOAD_CONCURRENCY: "8"
          CROP_SHARD_GROUPS: "10"
          CROP_QUEUE_URL: !Ref CropQueue

  CropQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CropQueue.Arn
      FunctionName: !Ref ReviewFunction
      BatchSize: 1
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 20

  ReviewFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ReviewFunction
      AuthType: NONE

  ReviewFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReviewFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ReviewFunctionInvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReviewFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  WebsiteBucket:
    Value: !Ref WebsiteBucket
  CloudFrontDistributionId:
    Value: !Ref WebsiteDistribution
  CloudFrontDomainName:
    Value: !GetAtt WebsiteDistribution.DomainName
  ApiUrl:
    Value: !GetAtt ReviewFunctionUrl.FunctionUrl
  ProgressTable:
    Value: !Ref ProgressTable
